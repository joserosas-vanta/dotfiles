---
- name: update | validate supported platform
  ansible.builtin.assert:
    that:
      - facts_is_arch or facts_is_ubuntu
      - not (facts_is_arch and facts_is_ubuntu)
    fail_msg: "Package updates support only Arch Linux and Ubuntu."
  tags: [update]

# Reuse pre-task detection to support both daemon and single-user installations.
- name: update | inspect managed Nix installation
  ansible.builtin.stat:
    path: >-
      {{ nix_detection.stdout | default('', true) | trim
         or '/nix/var/nix/profiles/default/bin/nix' }}
  register: update_nix_binary
  tags: [update]

- name: update | inspect Home Manager configuration
  ansible.builtin.stat:
    path: "{{ host_user_home }}/.config/home-manager/{{ item }}"
  loop:
    - flake.nix
    - home.nix
  register: update_home_manager_files
  when: update_nix_binary.stat.exists
  tags: [update]

- name: update | require configured Home Manager before upgrades
  ansible.builtin.assert:
    that:
      - update_nix_binary.stat.executable | default(false)
      - item.stat.isreg | default(false)
    fail_msg: "Nix/Home Manager is incomplete. Run dotfiles -t nix before dotfiles -t update."
  loop: "{{ update_home_manager_files.results }}"
  when: update_nix_binary.stat.exists
  tags: [update]

- name: update | configure Nix runtime
  ansible.builtin.set_fact:
    nix_binary_path: "{{ update_nix_binary.stat.path }}"
    nix_runtime_profile_script: "{{ nix_profile_script | default('') }}"
    nix_install_mode: "{{ 'daemon' if nix_daemon_running | default(false) else 'single-user' }}"
  when: update_nix_binary.stat.exists
  tags: [update]

- name: update | explain skipped Nix update
  ansible.builtin.debug:
    msg: "Managed Nix is not installed; no packages were updated. Run dotfiles -t nix first."
  when: not update_nix_binary.stat.exists
  tags: [update]

- name: update | refresh existing Home Manager flake inputs
  become: true
  become_user: "{{ 'root' if nix_requires_root_runner | default(false) else host_user }}"
  ansible.builtin.shell: |
    set -e
    if [ -f {{ nix_runtime_profile_script | quote }} ]; then
      . {{ nix_runtime_profile_script | quote }}
    fi
    if [ {{ nix_install_mode | quote }} = daemon ]; then
      export NIX_REMOTE=daemon
    fi
    export HOME={{ host_user_home | quote }}
    export USER={{ host_user | quote }}
    export LOGNAME={{ host_user | quote }}
    update_status=0
    {{ nix_binary_path | quote }} flake update || update_status=$?
    {% if nix_requires_root_runner | default(false) %}
    # Restore user ownership even if refreshing the lock failed after writing it.
    if [ -f flake.lock ]; then
      chown {{ (host_user ~ ':' ~ host_user) | quote }} flake.lock
    fi
    {% endif %}
    exit "$update_status"
  args:
    executable: /bin/bash
    chdir: "{{ host_user_home }}/.config/home-manager"
  changed_when: true
  when: update_nix_binary.stat.exists
  tags: [update]

- name: update | apply updated Home Manager configuration
  ansible.builtin.import_role:
    name: nix
    tasks_from: apply
  when: update_nix_binary.stat.exists
  tags: [update]
