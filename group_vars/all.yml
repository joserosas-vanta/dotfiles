default_roles:
  - bash
  - zsh
  - nix
  - git
  - c
  - nvim
  - opencode
  - pi
  - zellij
  - rex
  - slack-vanta
  - btop
  # - test

exclude_roles:
  - bootstrap

# Default values for system facts
facts_nix_installed: false
facts_home_manager_installed: false
facts_zsh_installed: false
facts_tailscale_installed: false
facts_tailscale_authed: false
tailscale_accept_dns: true

# Rex personal server (loopback only; access through SSH)
rex_port: 7297

# Repo that provides the slack-vanta CLI and skill (Ona's checkout location)
slack_vanta_repo: "/workspaces/obsidian"

# Nix/Home Manager releases
nixpkgs_release: "nixos-25.11"
home_manager_release: "release-25.11"

# Media tools releases
media_tools_yt_dlp_version: "2026.02.21"

# Pi defaults
pi_coding_agent_repository_url: "https://github.com/earendil-works/pi"
pi_default_provider: "claude-bridge"
pi_default_model: "claude-opus-5-5"
pi_default_thinking_level: "low"
pi_enabled_models:
  - "claude-bridge/claude-fable-5-1"
  - "claude-bridge/claude-opus-5-5"
  - "claude-bridge/claude-sonnet-5-5"
  - "openai-codex/gpt-5.6-luna"
  - "openai-codex/gpt-5.6-sol"
  - "openai-codex/gpt-5.6-terra"
  - "openai-codex/gpt-6-astra"
  - "openai-codex/gpt-6-luna"
  - "openai-codex/gpt-6-sol"
  - "openai-codex/gpt-6.1-sol"
  - "kimi-for-coding"
pi_guides_enable_global: true
pi_extra_packages: []
pi_managed_source_packages:
  - name: "pi-claude-bridge"
    repo: "https://github.com/elidickinson/pi-claude-bridge.git"
    ref: "5ea9bb88bd54395c1fe38cc95ec2ce1dbdcf15cc"  # v0.13.0
    checkout_path: "{{ host_user_home }}/.pi/agent/src/pi-claude-bridge"
    package_path: "{{ host_user_home }}/.pi/agent/src/pi-claude-bridge"
    dependency_marker: "node_modules/@anthropic-ai/claude-agent-sdk/package.json"
    install_command: "npm ci --omit=dev --legacy-peer-deps"
pi_guides_manage_local_checkout: true
pi_guides_local_checkout_path: "{{ host_user_home }}/pi-guides"
pi_guides_local_checkout_repo: "https://github.com/joserosas-vanta/vpi-guides.git"
# An empty ref follows the newest vX.Y.Z release; set a ref to pin it explicitly.
pi_guides_local_checkout_ref: ""
pi_guides_source: "{{ pi_guides_local_checkout_path }}"
pi_guides_git_install_path: "{{ host_user_home }}/.pi/agent/git/github.com/joserosas-vanta/vpi-guides"
pi_guides_git_remote_url: "https://github.com/joserosas-vanta/vpi-guides.git"
pi_guides_git_remote_url_normalized: "https://github.com/joserosas-vanta/vpi-guides"
pi_keybindings:
  app.interrupt:
    - ctrl+x
  app.model.cycleForward: []
  app.session.toggleNamedFilter: []
  app.session.togglePath: []
  tui.editor.cursorDown:
    - down
  tui.editor.cursorUp:
    - up
  tui.editor.pageDown:
    - pageDown
    - ctrl+down
  tui.editor.pageUp:
    - pageUp
    - ctrl+up
  tui.select.down:
    - down
    - ctrl+n
  tui.select.up:
    - up
    - ctrl+p

# Base package lists by distro
packages_common:
  - git
  - curl
  - unzip

packages_arch:
  - python
  - python-pip
  - openssh

packages_ubuntu:
  - python3
  - python3-pip
  - openssh-client
  - openssh-server

# Users facts
facts_host_user_exists: false

# Work VM user defaults
host_user: "vscode"
gh_user: "sillypoise"

# System identity
system_hostname: "sp-dev"

# Default work VM home directory
host_user_home: "/home/vscode"

# Define configs
